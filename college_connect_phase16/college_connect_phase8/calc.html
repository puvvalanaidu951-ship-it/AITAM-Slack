<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculator {
            width: 340px;
            padding: 25px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        h2 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        .display {
            width: 100%;
            height: 75px;
            background: #0f172a;
            color: white;
            border: none;
            outline: none;
            border-radius: 12px;
            text-align: right;
            padding: 15px;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #334155;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #475569;
            transform: scale(1.04);
        }

        .operator {
            background: #7c3aed;
        }

        .operator:hover {
            background: #6d28d9;
        }

        .clear {
            background: #ef4444;
        }

        .clear:hover {
            background: #dc2626;
        }

        .equal {
            background: #10b981;
            grid-column: span 2;
        }

        .equal:hover {
            background: #059669;
        }

        .zero {
            grid-column: span 2;
        }

        @media (max-width: 380px) {
            .calculator {
                width: 92%;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Basic Calculator</h2>

        <input type="text" class="display"
               id="display" value="0"
               readonly aria-label="Calculator display">

        <div class="buttons">

            <button class="clear" data-action="clear">AC</button>
            <button data-action="delete">DEL</button>
            <button data-action="percent">%</button>
            <button class="operator" data-operator="/">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operator="+">+</button>

            <button data-action="sign">+/-</button>
            <button class="zero" data-number="0">0</button>
            <button data-action="decimal">.</button>

            <button class="equal" data-action="equals">=</button>
        </div>

    </div>

    <script>

        const display = document.getElementById("display");
        const buttons = document.querySelector(".buttons");

        let firstOperand = null;
        let operator = null;
        let waitingForSecondOperand = false;

        // Update calculator display
        function updateDisplay(value) {
            display.value = value;
        }

        // Format calculation result
        function formatResult(number) {
            return String(Number(number.toPrecision(12)));
        }

        // Enter a number
        function inputNumber(number) {

            if (display.value === "Error") {
                clearCalculator();
            }

            if (waitingForSecondOperand) {
                updateDisplay(number);
                waitingForSecondOperand = false;
            } else {
                if (display.value === "0") {
                    updateDisplay(number);
                } else if (display.value.length < 15) {
                    updateDisplay(display.value + number);
                }
            }
        }

        // Enter decimal point
        function inputDecimal() {

            if (display.value === "Error") {
                clearCalculator();
            }

            if (waitingForSecondOperand) {
                updateDisplay("0.");
                waitingForSecondOperand = false;
                return;
            }

            if (!display.value.includes(".")) {
                updateDisplay(display.value + ".");
            }
        }

        // Perform arithmetic operations
        function calculate(a, b, op) {

            switch (op) {

                case "+":
                    return a + b;

                case "-":
                    return a - b;

                case "*":
                    return a * b;

                case "/":
                    return b === 0 ? null : a / b;

                default:
                    return b;
            }
        }

        // Select an operator
        function selectOperator(nextOperator) {

            const inputValue = parseFloat(display.value);

            if (operator && waitingForSecondOperand) {
                operator = nextOperator;
                return;
            }

            if (firstOperand === null) {
                firstOperand = inputValue;
            } else if (operator) {

                const result = calculate(
                    firstOperand,
                    inputValue,
                    operator
                );

                if (result === null || !Number.isFinite(result)) {
                    showError();
                    return;
                }

                firstOperand = result;
                updateDisplay(formatResult(result));
            }

            operator = nextOperator;
            waitingForSecondOperand = true;
        }

        // Calculate final result
        function showResult() {

            if (operator === null || waitingForSecondOperand) {
                return;
            }

            const secondOperand = parseFloat(display.value);

            const result = calculate(
                firstOperand,
                secondOperand,
                operator
            );

            if (result === null || !Number.isFinite(result)) {
                showError();
                return;
            }

            updateDisplay(formatResult(result));

            firstOperand = null;
            operator = null;
            waitingForSecondOperand = true;
        }

        // Clear calculator
        function clearCalculator() {
            updateDisplay("0");
            firstOperand = null;
            operator = null;
            waitingForSecondOperand = false;
        }

        // Delete last digit
        function deleteNumber() {

            if (waitingForSecondOperand || display.value === "Error") {
                return;
            }

            const value = display.value;

            updateDisplay(
                value.length > 1
                    ? value.slice(0, -1)
                    : "0"
            );
        }

        // Percentage calculation
        function calculatePercent() {

            if (display.value === "Error") return;

            const result = parseFloat(display.value) / 100;

            updateDisplay(formatResult(result));
            waitingForSecondOperand = false;
        }

        // Change positive to negative
        function changeSign() {

            if (display.value === "Error") return;

            if (display.value !== "0") {
                updateDisplay(
                    String(parseFloat(display.value) * -1)
                );
            }
        }

        // Display error
        function showError() {
            updateDisplay("Error");
            firstOperand = null;
            operator = null;
            waitingForSecondOperand = true;
        }

        // Handle button clicks
        buttons.addEventListener("click", function(event) {

            const button = event.target;

            if (button.dataset.number !== undefined) {
                inputNumber(button.dataset.number);
            }

            if (button.dataset.operator) {
                selectOperator(button.dataset.operator);
            }

            switch (button.dataset.action) {

                case "clear":
                    clearCalculator();
                    break;

                case "delete":
                    deleteNumber();
                    break;

                case "decimal":
                    inputDecimal();
                    break;

                case "equals":
                    showResult();
                    break;

                case "percent":
                    calculatePercent();
                    break;

                case "sign":
                    changeSign();
                    break;
            }

        });

        // Keyboard support
        document.addEventListener("keydown", function(event) {

            const key = event.key;

            if (/^[0-9]$/.test(key)) {
                inputNumber(key);
            }

            else if (key === ".") {
                inputDecimal();
            }

            else if (["+", "-", "*", "/"].includes(key)) {
                selectOperator(key);
            }

            else if (key === "Enter" || key === "=") {
                event.preventDefault();
                showResult();
            }

            else if (key === "Backspace") {
                deleteNumber();
            }

            else if (key === "Escape") {
                clearCalculator();
            }

        });

    </script>

</body>
</html>
